name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            build-essential \
            git \
            unzip \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: python3 -m pip install --user buildozer

      - name: Compilar APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: scooter-pro-apk
          path: bin/*.apk
